[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"
[project]
name = "defensive-ctig"
version = "0.1.0"
description = "Evidence-aware defensive cyber threat intelligence graph"
requires-python = ">=3.12"
[project.scripts]
ctig = "src.cli:main"
[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable Neo4j database"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
[tool.bandit]
exclude_dirs = ["tests"]
